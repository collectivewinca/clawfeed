<script>
document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

function fmtLongDate(s) {
    if (!s) return '';
    const d = new Date(s.replace(' ', 'T') + 'Z');
    if (isNaN(d)) return s;
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c] || c);
}

// Pull a real headline from the brief markdown:
// 1. First "## Thread N: Title" or "## Lede"+sub
// 2. Or first non-H1 H2
// 3. Fallback: short slice of first paragraph
function extractHeadline(content) {
    if (!content) return null;
    const lines = content.split('\n');
    for (const raw of lines) {
        const line = raw.trim();
        const m = line.match(/^##\s+(?:Thread\s+\d+:\s*)?(.+?)\s*$/);
        if (m) {
            const title = m[1].trim();
            if (title.toLowerCase() === 'lede') continue;
            return title.replace(/^\*\*|\*\*$/g, '').trim();
        }
    }
    // fall-through: first non-empty paragraph
    const para = lines.find(l => l.trim() && !l.startsWith('#') && !l.startsWith('---'));
    if (para) return para.trim().slice(0, 100);
    return null;
}

function extractDek(content) {
    if (!content) return '';
    // Look for "## Lede" then take the first paragraph after it
    const ledeIdx = content.search(/^##\s+Lede/im);
    if (ledeIdx === -1) return '';
    const after = content.slice(ledeIdx).split('\n');
    for (let i = 1; i < after.length; i++) {
        const line = after[i].trim();
        if (!line || line.startsWith('---') || line.startsWith('#')) continue;
        return line.slice(0, 240);
    }
    return '';
}

(async () => {
    const root = document.getElementById('dispatch-list');
    try {
        const list = await (await fetch('/api/digests?type=daily&limit=200')).json();
        if (!Array.isArray(list) || !list.length) {
            root.innerHTML = '<div class="editorial-card p-8 text-gray-500"><p class="font-serif text-lg">Archive is empty.</p><p class="text-sm mt-2">A new dispatch lands daily at 14:35 UTC.</p></div>';
            return;
        }
        root.innerHTML = list.map(d => {
            const headline = extractHeadline(d.content) || 'Untitled dispatch';
            const dek = extractDek(d.content);
            const date = fmtLongDate(d.created_at);
            return `
            <a href="/brief/${d.id}" class="block group" style="text-decoration:none;color:inherit;">
                <article class="border-b border-gray-200 py-8 first:pt-0 group-hover:bg-white transition px-2 -mx-2">
                    <div class="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-2">${date}</div>
                    <h2 class="font-serif text-2xl md:text-3xl font-bold leading-tight group-hover:text-gray-700 transition">${escapeHtml(headline)}</h2>
                    ${dek ? `<p class="text-gray-600 leading-relaxed mt-3 max-w-2xl">${escapeHtml(dek)}</p>` : ''}
                    <div class="text-[10px] font-mono uppercase tracking-widest text-blue-700 mt-3">Read edition &rarr;</div>
                </article>
            </a>`;
        }).join('');
    } catch (e) {
        root.innerHTML = '<div class="editorial-card p-8 text-red-700">Failed to load the archive.</div>';
    }
})();
</script>
