applyLang();

// ── Feedback Chat Bubble ──
(async function() {
  const style = document.createElement('style');
  style.textContent = `
    .fb-bubble { position:fixed; bottom:24px; right:24px; width:48px; height:48px; border-radius:50%; background:var(--ink); color:var(--paper); border:none; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 22px rgba(20,17,13,.18); z-index:1000; transition:transform .15s, background .15s; }
    .fb-bubble:hover { transform:scale(1.06); background:var(--accent); }
    .fb-bubble .fb-dot { position:absolute; top:0; right:0; width:10px; height:10px; background:var(--accent); border-radius:50%; display:none; border:2px solid var(--paper); }
    .fb-panel { position:fixed; bottom:84px; right:24px; width:340px; height:420px; background:var(--paper-elev); border:1px solid var(--hairline); border-radius:0; z-index:1001; display:flex; flex-direction:column; box-shadow:0 14px 44px rgba(20,17,13,.14); transform:translateY(20px); opacity:0; pointer-events:none; transition:transform .25s ease, opacity .25s ease; }
    .fb-panel.open { transform:translateY(0); opacity:1; pointer-events:auto; }
    .fb-header { padding:14px 18px; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between; align-items:center; font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); }
    .fb-close { background:none; border:none; color:var(--ink-mute); cursor:pointer; font-size:20px; padding:0 4px; line-height:1; }
    .fb-close:hover { color:var(--ink); }
    .fb-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .fb-msg { max-width:85%; padding:9px 12px; border-radius:0; font-family:var(--font-body); font-size:13.5px; line-height:1.55; word-break:break-word; }
    .fb-msg.user { align-self:flex-end; background:var(--accent-tint); color:var(--ink); border-right:2px solid var(--accent); }
    .fb-msg.reply { align-self:flex-start; background:transparent; color:var(--ink-soft); border-left:2px solid var(--ink); }
    .fb-msg .fb-time { font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:4px; letter-spacing:.04em; }
    .fb-empty { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; font-family:var(--font-body); font-style:italic; color:var(--ink-mute); font-size:13.5px; line-height:1.6; }
    .fb-input { padding:12px; border-top:1px solid var(--hairline); display:flex; flex-direction:column; gap:8px; }
    .fb-input textarea { width:100%; resize:none; background:var(--paper); border:1px solid var(--hairline); border-radius:0; color:var(--ink); padding:8px 10px; font-family:var(--font-body); font-size:13.5px; height:64px; }
    .fb-input textarea:focus { outline:none; border-color:var(--ink); }
    .fb-input input { width:100%; background:var(--paper); border:1px solid var(--hairline); border-radius:0; color:var(--ink); padding:6px 10px; font-family:var(--font-body); font-size:12px; }
    .fb-input input:focus { outline:none; border-color:var(--ink); }
    .fb-send { padding:7px 18px; background:var(--ink); color:var(--paper); border:none; border-radius:0; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; align-self:flex-end; transition:background .15s; }
    .fb-send:hover { background:var(--accent); }
    .fb-send:disabled { opacity:.5; cursor:default; }
    @media (max-width:480px) { .fb-panel { left:12px; right:12px; width:auto; bottom:78px; height:60vh; } .fb-bubble { bottom:16px; right:16px; } }
  `;
  document.head.appendChild(style);

  // Check if feedback is enabled via API config
  try {
    const fcfg = await fetch(`${API}/config`).then(r => r.json()).catch(() => ({}));
    if (fcfg.feedbackEnabled === false) return; // Don't show bubble
  } catch {}

  const bubble = document.createElement('button');
  bubble.className = 'fb-bubble';
  bubble.innerHTML = '💬<span class="fb-dot"></span>';
  document.body.appendChild(bubble);

  const panel = document.createElement('div');
  panel.className = 'fb-panel';
  panel.innerHTML = `
    <div class="fb-header"><span class="fb-title"></span><button class="fb-close">×</button></div>
    <div class="fb-messages"></div>
    <div class="fb-input">
      <div class="fb-anon-fields" style="display:none;"><input class="fb-email" type="email"><input class="fb-name" style="margin-top:4px;"></div>
      <textarea class="fb-text"></textarea>
      <button class="fb-send"></button>
    </div>`;
  document.body.appendChild(panel);

  let fbOpen = false, fbLoaded = false, fbLastCount = 0;

  function fbUpdateI18n() {
    panel.querySelector('.fb-title').textContent = t('feedbackTitle');
    panel.querySelector('.fb-text').placeholder = t('feedbackPlaceholder');
    panel.querySelector('.fb-email').placeholder = t('feedbackEmailPlaceholder');
    panel.querySelector('.fb-name').placeholder = t('feedbackNamePlaceholder');
    panel.querySelector('.fb-send').textContent = t('feedbackSend');
  }

  function fbRender(items) {
    const msgs = panel.querySelector('.fb-messages');
    if (!items.length) {
      msgs.innerHTML = `<div class="fb-empty">${t('feedbackEmpty')}</div>`;
      return;
    }
    msgs.innerHTML = items.map(m => {
      let html = `<div class="fb-msg user">${esc(m.message)}<div class="fb-time">${m.created_at}</div></div>`;
      if (m.reply) html += `<div class="fb-msg reply">${esc(m.reply)}<div class="fb-time">${m.replied_at || ''}</div></div>`;
      return html;
    }).join('');
    msgs.scrollTop = msgs.scrollHeight;
    // Check unread
    const replied = items.filter(i => i.reply).length;
    if (replied > fbLastCount) panel.querySelector('.fb-dot')?.style && (bubble.querySelector('.fb-dot').style.display = 'block');
    fbLastCount = replied;
  }

  async function fbLoad() {
    try {
      const r = await fetch(`${API}/feedback`, { credentials:'same-origin' });
      const items = await r.json();
      fbRender(Array.isArray(items) ? items : []);
      fbLoaded = true;
    } catch { fbRender([]); }
  }

  bubble.onclick = () => {
    fbOpen = !fbOpen;
    panel.classList.toggle('open', fbOpen);
    if (fbOpen) {
      fbUpdateI18n();
      // Show anon fields if not logged in
      panel.querySelector('.fb-anon-fields').style.display = currentUser ? 'none' : 'block';
      if (!fbLoaded || currentUser) fbLoad();
      bubble.querySelector('.fb-dot').style.display = 'none';
    }
  };
  panel.querySelector('.fb-close').onclick = () => { fbOpen = false; panel.classList.remove('open'); };

  panel.querySelector('.fb-send').onclick = async () => {
    const text = panel.querySelector('.fb-text').value.trim();
    if (!text) return;
    const btn = panel.querySelector('.fb-send');
    btn.disabled = true;
    const body = { message: text };
    if (!currentUser) {
      const email = panel.querySelector('.fb-email').value.trim();
      const name = panel.querySelector('.fb-name').value.trim();
      if (email) body.email = email;
      if (name) body.name = name;
    }
    try {
      const r = await fetch(`${API}/feedback`, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const d = await r.json();
      if (d.ok) {
        panel.querySelector('.fb-text').value = '';
        showToast(t('feedbackSent'));
        if (currentUser) fbLoad();
        else {
          // For anon, just show the sent message
          const msgs = panel.querySelector('.fb-messages');
          const empty = msgs.querySelector('.fb-empty');
          if (empty) empty.remove();
          msgs.insertAdjacentHTML('beforeend', `<div class="fb-msg user">${esc(text)}<div class="fb-time">just now</div></div>`);
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
    } catch {}
    btn.disabled = false;
  };

  // Send on Ctrl+Enter
  panel.querySelector('.fb-text').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { panel.querySelector('.fb-send').click(); }
  });

  // Periodically check for new replies (every 60s when panel open)
  setInterval(() => { if (fbOpen && currentUser) fbLoad(); }, 60000);
})();

// Detect /pack/:slug URL
const packPageMatch = location.pathname.match(/\/pack\/([a-z0-9_-]+)/);
// Detect ?d=<id>[,<id>...] deep-link (used by emails / shared URLs)
const deepLinkDigest = new URLSearchParams(location.search).get('d');
checkAuth().then(async () => {
  if (packPageMatch) {
    renderPackDetailPage(packPageMatch[1]);
  } else if (currentPackSlug) {
    renderPackDetailPage(currentPackSlug);
  } else {
    await renderList();
    if (deepLinkDigest && /^[\d,]+$/.test(deepLinkDigest)) {
      loadDigest(deepLinkDigest);
    }
  }
});
